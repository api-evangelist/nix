aid: nix
name: Nix
description: >-
  Nix (Nix Biosensors) develops wearable biosensor technology that analyzes
  sweat to deliver real-time hydration and electrolyte data. Its lightweight
  single-use biosensor patch continuously measures fluid and electrolyte losses
  and provides personalized hydration guidance to athletes, service members, and
  laborers. The company ships two consumer/enterprise offerings: Nix Solo, an
  individual app for self-monitoring hydration, and Nix Pro, a group-monitoring
  platform that lets coaches and supervisors track multiple users. Nix is a
  Techstars portfolio company. As of this enrichment pass it operates a
  direct-to-consumer commerce and mobile-app business with no public developer
  program, API documentation, or SDK surface.
